apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/calmcat2/Django-on-k8s
    path: Helm-chart/
    targetRevision: HEAD
  destination:
    server: "https://kubernetes.default.svc"
    namespace: django-app