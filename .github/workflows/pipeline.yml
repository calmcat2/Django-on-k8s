name: "Development pipeline"
on:
  push:
    branches:
      - main
    paths:
      - 'littlelemon/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'Helm-chart/**'
      - '!Helm-chart/Chart.yaml'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  # detect which files have changes. If any file in the Helm-chart directory has changed, the chart-files-changed output will be set to true.
  # If any file in the Django-app directory has changed, Django tests will be run.
  test:
    name: Django test
    runs-on: ubuntu-latest
    env:
      DB_PORT : "3306"
      DB_HOST : "127.0.0.1"
      STATIC_ROOT : "/data/static"
      DEBUG : "False"
      ALLOWED_HOSTS : "localhost"
      CSRF_TRUSTED_ORIGINS : "http://localhost:30005"
      DJANGO_SECRET_KEY : 'django-insecure'
      DB_ENGINE : 'django.db.backends.sqlite3'
      MYSQL_DATABASE: 'littlelemon'
      MYSQL_USER : 'littlelemon' 
      MYSQL_PASSWORD : 'littlelemon@123'   
      DB_OPTIONS : '{}'
    
    outputs:
      chart-files-changed: ${{ steps.filters.outputs.image-files-changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filters
        with:
          filters: |
            chart-files-changed:
              - 'Helm-chart/**'
            app-files-changed:
              - 'littlelemon/**'
            image-files-changed:
              - 'Dockerfile'
              - 'requirements.txt'
              - 'littlelemon/**'

      - name: install python
        if: steps.filters.outputs.app-files-changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - if: steps.filters.outputs.app-files-changed == 'true'
        name: Install dependencies &  run tests
        run: |
          sudo apt-get update
          sudo apt-get install python3-dev default-libmysqlclient-dev build-essential pkg-config
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python3 littlelemon/manage.py test restaurant.tests

  # run only if some non-chart file was changed        
  build_image:
    needs: test
    if: ${{ needs.test.outputs.image-chart-files-changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: mhe5/django-k8s-custom-web:${{ github.RUN_NUMBER }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'mhe5/django-k8s-custom-web:${{ github.RUN_NUMBER }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Push image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: mhe5/django-k8s-custom-web:${{ github.RUN_NUMBER }}
  
  Update_Helm_chart:
    runs-on: ubuntu-latest
    needs: build_image
    if: needs.build_image.result == 'success' || needs.build_image.result == 'skipped'
    steps:
      - name: Update Helm chart
        run: |
          INCREMENT_TYPE=${{vars.INCREMENT_TYPE}}
          FILE="Helm-chart/Chart.yaml"
          CURRENT_VERSION=$(grep oP "(?<=version:) \d\.\d.\d{1,3}" $FILE)
          major=$(echo $CURRENT_VERSION | cut -d. -f1)
          minor=$(echo $CURRENT_VERSION | cut -d. -f2)
          patch=$(echo $CURRENT_VERSION | cut -d. -f3)
          if ["INCREMENT_TYPE" == "major"]; then
            major=$major+1
          elif ["INCREMENT_TYPE" == "minor"]; then
            minor=$minor+1
          else
            patch=$patch+1
          fi
          NEW_VERSION=$major.$minor.$patch
          sed -i "s/version: $CURRENT_VERSION/version: $NEW_VERSION/" Helm-chart/values.yaml
          sed -i "s/tag: .*/tag: ${{ github.RUN_NUMBER }}/" Helm-chart/values.yaml
          
      - name: Run the Action
        uses: devops-infra/action-commit-push@master
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          add_timestamp: true
          commit_message: "Helm chart version updated by GitHub Actions"
          force: false
          target_branch: main
