name: "Development pipeline"
on:
  push:
    branches:
      - main
    paths:
      - 'littlelemon/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'Helm-chart/**'
      - '!Helm-chart/Chart.yaml'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }} # Get the branch name from the event payload
  INCREMENT_TYPE: 'patch' # Set the default increment type to patch
jobs:
  # detect which files have changes. If any file in the Helm-chart directory has changed, the chart-files-changed output will be set to true.
  # If any file in the Django-app directory has changed, Django tests will be run.
  test:
    name: Django test
    runs-on: ubuntu-latest
    env:
      DB_PORT : "3306"
      DB_HOST : "127.0.0.1"
      STATIC_ROOT : "/data/static"
      DEBUG : "False"
      ALLOWED_HOSTS : "localhost"
      CSRF_TRUSTED_ORIGINS : "http://localhost:30005"
      DJANGO_SECRET_KEY : 'django-insecure'
      DB_ENGINE : 'django.db.backends.sqlite3'
      MYSQL_DATABASE: 'littlelemon'
      MYSQL_USER : 'littlelemon' 
      MYSQL_PASSWORD : 'littlelemon@123'   
      DB_OPTIONS : '{}'
    
    outputs:
      image-needs-update: ${{ steps.filters.outputs.image-needs-update }}
      helm-needs-update: ${{ steps.filters.outputs.helm-needs-update }}
      
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filters
        with:
          filters: |
            helm-needs-update:
              - 'Helm-chart/**'
              - 'Dockerfile'
              - 'requirements.txt'
              - 'littlelemon/**'
            image-needs-update:
              - 'Dockerfile'
              - 'requirements.txt'
              - 'littlelemon/**'

      - name: Setup Python
        if: steps.filters.outputs.image-needs-update == 'true'
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.11.11'
      - name: Install system dependencies
        if: steps.filters.outputs.image-needs-update == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install python3-dev default-libmysqlclient-dev build-essential pkg-config
          pip install -r requirements.txt
      - name: Run Django tests on Restaurant app
        if: steps.filters.outputs.image-needs-update == 'true'
        run: python3 littlelemon/manage.py test restaurant.tests

  # run only if some non-chart file was changed        
  build_image:
    needs: test
    if: ${{ needs.test.outputs.image-needs-update == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: mhe5/django-k8s-custom-web:${{ env.BRANCH_NAME }}-${{ github.RUN_NUMBER }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'mhe5/django-k8s-custom-web:${{ env.BRANCH_NAME }}-${{ github.RUN_NUMBER }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Push image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: mhe5/django-k8s-custom-web:${{ env.BRANCH_NAME }}-${{ github.RUN_NUMBER }}
  
  Update_Helm_chart:
    runs-on: ubuntu-latest
    needs: [build_image,test]
    permissions:
      contents: write
    if: ${{ !failure() && !cancelled() && needs.test.outputs.helm-needs-update == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update version in Helm chart
        run: |
          INCREMENT_TYPE=${{ env.INCREMENT_TYPE }}
          FILE="Helm-chart/Chart.yaml"
          CURRENT_VERSION=$(grep -oP "(?<=version: )\d{1,3}\.\d{1,3}.\d{1,3}" $FILE)
          echo "Current version: $CURRENT_VERSION"
          major=$(echo $CURRENT_VERSION | cut -d. -f1)
          minor=$(echo $CURRENT_VERSION | cut -d. -f2)
          patch=$(echo $CURRENT_VERSION | cut -d. -f3)
          if [ "$INCREMENT_TYPE" = "major" ]; then
            major=$((major+1))
          elif [ "$INCREMENT_TYPE" = "minor" ]; then
            minor=$((minor+1))
          else
            patch=$((patch+1))
          fi
          NEW_VERSION=${major}.${minor}.${patch}
          echo "New version: $NEW_VERSION"
          echo "Updating app version in the Chart.yaml"
          sed -i "s/version: $CURRENT_VERSION/version: $NEW_VERSION/" Helm-chart/Chart.yaml
      
      - name: Update image version in Helm chart
        if: needs.build_image.result == 'success'
        run: |
          echo "Updating image version in the values.yaml"
          sed -i "0,/tag: .*/s//tag: ${{ env.BRANCH_NAME }}-${{ github.RUN_NUMBER }}/" Helm-chart/values.yaml
          
      - name: Commit and push changes to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Helm chart version/image tag updated by GitHub Actions"
          commit_user_name: "GitHub Actions"
