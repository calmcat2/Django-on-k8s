apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: "{{- .Values.namespace}}"
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
        {{- include "django-app.labels" . | nindent 8 }}
    spec:
      initContainers:
      - name: init-mysql
        image: busybox
        command: ['sh', '-c', 'echo $(ls -A /var/lib/mysql/)']
        volumeMounts:
        - name: db-data
          mountPath: "/var/lib/mysql/"
      containers:
      - name: mysql
        image: "{{.Values.image.mysql.repository}}:{{.Values.image.mysql.tag}}"
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_DATABASE
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD
        resources:
          requests:
            memory: 500Mi
            cpu: 50m
          limits:
            memory: 1Gi
            cpu: 1
        ports:
        - containerPort: 3306
        volumeMounts:
          - mountPath: /var/lib/mysql/
            name: db-data
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: mysql-pvc