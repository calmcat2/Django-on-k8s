apiVersion: v1
kind: PersistentVolume
metadata:
  name: staticfiles-pv
  namespace: "{{- .Values.namespace}}"
  labels:
    type: local
    app: django-staticfiles
    {{- include "django-app.labels" . | nindent 4 }}
spec:
  storageClassName: "{{ .Values.storageClassName.staticfiles }}"
  persistentVolumeReclaimPolicy: "{{ .Values.reclaimPolicy.staticfiles }}"
  capacity:
    storage: "{{ .Values.storageSize.staticfiles }}"
  accessModes:
    - "{{ .Values.accessMode.staticfiles }}"
  hostPath:
    path: "{{ .Values.hostpath.staticfiles }}"