apiVersion: v1
kind: PersistentVolume
metadata:
  name: staticfiles-pv
  namespace: "{{- .Values.namespace}}"
  labels:
    type: local
    app: django-staticfiles
    {{- include "django-app.labels" . | nindent 4 }}
spec:
  storageClassName: manual
  capacity:
    storage: 500M
  accessModes:
    - ReadWriteMany
  hostPath:
    path: "{{ .Values.hostpath.staticfiles }}"